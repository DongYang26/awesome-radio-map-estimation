id: '2605.31265'
title: 'Subjective Time Deformation in Intertemporal Choice: A Functional Data Analysis Approach'
authors:
  - Fabrizio Maturo
  - Salvador Cruz Rambaud
  - Vincenzo Li Calzi
  - Andrea Mazzitelli
  - Annamaria Porreca
year: 2026
abstract: Intertemporal choice data are usually summarized through scalar discount-rate parameters or fitted by predetermined parametric discount functions, although relevant information may lie in the shape of the whole discounting trajectory. This paper proposes a Functional Data Analysis framework for reconstructing and analyzing implicit subjective-time trajectories from discrete intertemporal equivalence judgments. Monetary equivalence responses from a multilingual questionnaire are transformed into individual discount curves, regularized by monotone smoothing, and used to recover normalized implicit subjective-time trajectories. The trajectories are examined through derivative summaries, Functional Principal Component Analysis, and clustering on standardized component scores. The empirical application, based on 107 participants, shows that heterogeneity in intertemporal choice is not fully captured by scalar discount-rate variation. The first two functional principal components explain 97.44% of the variability, indicating a low-dimensional structure. Functional clustering identifies three stable profiles of temporal deformation, supported by bootstrap stability analysis and sensitivity checks on components, algorithms, distances, smoothing specifications, and outlier treatment. Parametric benchmarks based on exponential, Weber-Fechner, and Stevens specifications provide accurate fits for many individuals, but do not fully recover the functional clustering structure. The comparison with explicit subjective-time perception measures reveals only partial alignment between implicit trajectories reconstructed from choices and directly reported temporal perception. Functional Data Analysis provides an applied statistical framework for representing intertemporal choice heterogeneity as variation in functional shape, complementing scalar discount-rate and parametric subjective-time models.
