id: itu-r-p-833-physics-augmented-deep-learning-for-vegetation-a
title: ITU-R P.833 Physics-Augmented Deep Learning for Vegetation-Aware Radio Map Estimation
authors:
  - Si-Min Ma
  - Guan-Gen Wu
  - Dong Liu
year: 2026
venue: IEEE Access
abstract: Radio maps give the path loss from a transmitter at every location in an area and underpin network planning. Vegetation causes substantial attenuation at 5G/6G frequencies, yet deep-learning estimators treat it as generic clutter rather than as an explicit, controllable input. This paper injects vegetation attenuation, following a first-order form of Recommendation ITU-R P.833, into the RadioMapSeer path loss ground truth along each transmitter–receiver line, and feeds the vegetation layout to the network as an extra input channel. Because the injection is fixed by the vegetation mask and two physical parameters, the channel’s gain is predictable before training, and the specific attenuation realized by any path loss map can be recovered. This prediction holds across five attenuation levels from 0.2 to 1.5 dB/m; at the nominal level, the channel cuts the root mean square error of U-Net++ from 6.10 to 3.22 dB, with consistent gains on two other backbones. After transfer to an independently modeled campus scene with three-dimensional ray-traced ground truth and one global affine calibration, the vegetation channel lowers the error from 7.19 to 5.39 dB, mostly in vegetation-shadowed regions. A standardized physical model thus improves coverage prediction in vegetated scenes without changing the network architecture.
