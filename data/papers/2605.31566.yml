id: '2605.31566'
title: Insights on the Gamma-Ray Bursts variability in their cosmological rest frame
authors:
  - Giovanni Della Casa
  - Fabrizio Fiore
  - Giuseppe Dilillo
  - Simonetta Puccetti
  - Andrea Vacchi
year: 2026
abstract: Gamma-ray bursts temporal profile can be extremely variable, going from a single pulse of a few seconds duration to multiple superimposed pulses occurring over tens or even hundreds of seconds. The variability displayed in the lightcurve of each gamma-ray burst can be the result of the activity taking place in the central engine that generates these violent phenomena, as well as due to magnetic reconnection activities at larger distances. The objective of this work is to find the shortest variability hidden in the lightcurves of the GRBs, with particular focus for the ones with measured redshift, on timescales as short as few milliseconds. This variability will then be related to physical characteristics of the central engine, and evidences of its relation with the spectral parameters of the burst, such as the isotropic energy and peak energy, will be presented. This research is even more relevant in view of the future generation of satellites with improved timing resolution, that will allow us to explore the possible variability in the microsecond region.
