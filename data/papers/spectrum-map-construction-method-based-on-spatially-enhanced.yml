id: spectrum-map-construction-method-based-on-spatially-enhanced
title: Spectrum Map Construction Method Based on Spatially-Enhanced Channel Attention
authors:
  - Siqi Peng
  - Han Zhang
  - Cong'an Xu
  - Wei Zhang
  - Yun Lin
year: 2024
venue: 2024 International Conference on Ubiquitous Communication (Ucom)
abstract: In sixth-generation (6G) wireless communication networks, spectrum map are crucial for network optimization and the intelligent management of electromagnetic spectrum. Spectrum map provide information on spatial power spectral density (PSD) distribution and spectrum resource occupancy. However, the complexities of urban environments and sparse PSD measurements pose challenges to accurately constructing high-resolution spectrum map. This paper introduces a Dual Attention Spectrum Cartography (DASC) method that utilizes channel features and spatial information through a joint spatial channel attention mechanism. This approach enhances the learning of propagation patterns and shadowing effects in complex environments, thereby improving the quality of spectrum map construction. Experimental results demonstrate that our method outperforms other deep learning models and interpolation algorithms in both performance and generalization capabilities.
