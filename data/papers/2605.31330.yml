id: '2605.31330'
title: Social welfare optimisation under institutional reward and punishment
authors:
  - Van An Nguyen
  - Vuong Khang Huynh
  - Huu Loi Bui
  - Hai Anh Ha
  - Quang Dung Le
  - Tan Dat Nguyen
  - Ngoc Ngu Nguyen
