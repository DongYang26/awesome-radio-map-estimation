id: '2601.03601'
title: 'F4-CKM: Learning Channel Knowledge Map With Radio Frequency Radiance Field Rendering'
authors:
  - Kequan Zhou
  - Guangyi Zhang
  - Hanlei Li
  - Yunlong Cai
  - Shengli Liu
  - Guanding Yu
year: 2026
venue: IEEE Transactions on Communications
abstract: 'In 6G mobile communications, acquiring accurate and timely channel state information (CSI) becomes increasingly challenging due to the growing antenna array size and bandwidth. To alleviate the CSI feedback burden, the channel knowledge map (CKM) has emerged as a promising approach by leveraging environment-aware techniques to predict CSI based solely on user locations. However, how to effectively construct a CKM remains an open issue. In this paper, we propose F4-CKM, a novel CKM construction framework characterized by four distinctive features: radiance Field rendering, spatial-Frequency-awareness, location-Free usage, and Fast learning. Central to our design is the adaptation of radiance field rendering techniques from computer vision to the radio frequency (RF) domain, enabled by a novel Wireless Radiator Representation (WiRARE) network that captures the spatial-frequency characteristics of wireless channels. Additionally, a novel shaping filter module and an angular sampling strategy are introduced to facilitate CKM construction. Extensive experiments demonstrate that F4-CKM significantly outperforms existing baselines in terms of wireless channel prediction accuracy and efficiency.'
