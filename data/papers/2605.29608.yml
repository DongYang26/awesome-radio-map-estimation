id: '2605.29608'
title: Log-Sobolev Inequality for Wolff Dynamics and Application to the Condensation of Eigen Microstate in the 1D Ising Model
authors:
  - Kaiyuan Cui
  - Fuzhou Gong
year: 2026
abstract: The Wolff dynamics is a non-local Markov chain widely used for simulating the Ising model due to its effectiveness in reducing critical slowing down compared to the Glauber dynamics. Despite extensive algorithmic and numerical studies, a rigorous probabilistic understanding remains limited. In this paper, we take a first step toward addressing this gap. For the one-dimensional (1D) Ising model, we first derive the transition probabilities of the Wolff dynamics and show that, at the critical point, it converges to the two fully aligned configurations and subsequently oscillates between them. This behavior is absent in the Glauber dynamics. Second, we establish a log-Sobolev inequality with an explicit constant for the Wolff dynamics in the entire subcritical regime and derive quantitative bounds on its ergodic averages. As a by-product, at infinite temperature, the obtained constant coincides with the classical log-Sobolev constant of the random walk on the hypercube. Finally, we apply these results to analyze the spectrum of the sample covariance matrix generated by the Wolff dynamics, which was used by Chen et al. to study condensation of eigen microstate. We prove that the spectral behavior agrees with their simulations in the 1D Ising model, thereby providing theoretical support for their findings.
