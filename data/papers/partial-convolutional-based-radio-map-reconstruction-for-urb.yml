id: partial-convolutional-based-radio-map-reconstruction-for-urb
title: Partial Convolutional Based-Radio Map Reconstruction for Urban Environments with Inaccessible Areas
authors:
  - Fanhua Li
  - Yuanyuan Deng
  - Bo Zhou
  - Qihui Wu
year: 2024
venue: IEEE International Conference on Acoustics, Speech, and Signal Processing
abstract: The radio map, which describes spatial signal strength and network coverage information, is crucial in modern wireless systems for network planning and resource management. Fine-grained radio maps rely on measurements collected by sparsely deployed spectrum sensors in the area of interest. However, due to physical limitations and security considerations, these measurements may exhibit non-uniform distribution and be entirely absent in certain inaccessible areas, making it challenging for accurate radio map reconstruction. Thus, in this work, considering the issues of non-uniform sampling and inaccessible areas, we propose a deep completion partial convolution network for radio map reconstruction. This approach captures the spatial characteristics by separating the missing measurements from sampled ones and does not require prior knowledge of emitters. We evaluate our method using a simulated dataset for campus environments and demonstrate its effectiveness over several baselines for reconstructing radio maps.
