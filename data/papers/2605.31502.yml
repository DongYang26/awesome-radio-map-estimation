id: '2605.31502'
title: Complex Diophantine Approximations and Cusp Excursions
authors:
  - Nathan Dalaklis
  - Yan Mary He
year: 2026
abstract: We study the Hausdorff dimension spectrum of asymptotic approximation rates of complex Diophantine approximation and that of the asymptotic average excursion time of cusp excursions on the Bianchi orbifold $\mathbb{H}^3/\operatorname{PSL}(2,\mathbb {Z}[i])$ via a unified approach using the Hurwitz map. In particular, we construct a conformal graph directed system (CGDS) for the Hurwitz map and show that the Lyapunov exponent of the Hurwitz CGDS simultaneously captures the asymptotic approximation rate and the the asymptotic average excursion time. Applying the multifractal analysis of Lyapunov exponents for this system, we obtain a formula and real-analyticity for the Hausdorff dimension spectrum functions.
