id: a-deep-learning-based-reconstruction-method-for-3d-low-altit
title: A deep-learning-based reconstruction method for 3D low-altitude propagation fields
authors:
  - Chen Liang
  - Tianqi Xiang
  - Ya Liu
  - Xin Li
  - Weiyan Chen
  - Xin Zhang
year: 2025
venue: International Conference on Advanced Robotics, Automation Engineering, and Machine Learning
abstract: This paper presents a deep learning-based reconstruction method for low-altitude channel path loss propagation fields. Six constructed datasets are respectively used to train a convolutional neural network (CNN) that extracts spatial distribution and height features of buildings from three-dimensional geographic information. The neural network achieves high accuracy across multiple altitudes, demonstrating its potential for 3D spatial application. Additionally, an interpolation algorithm, which incorporates wireless signal propagation characteristics, is proposed to predict values at arbitrary points on the global map. A comparative analysis with traditional ray tracing methods demonstrates that the proposed approach significantly reduces computational time while maintaining high prediction accuracy.
