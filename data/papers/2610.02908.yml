id: '2610.02908'
title: Permutation-Invariant Time-Frequency Segmentation and Parameter Estimation of Multiple Overlapping Interference Signals
authors:
  - Lucas Heublein
  - Christian Wielenberg
  - Christopher Mutschler
  - Felix Ott
year: 2026
abstract: Radio-frequency interference threatens satellite navigation, wireless communications, radar, and industrial sensing. Reliable operation therefore requires spectrum situational awareness to detect interference and determine the number, time-frequency occupancy, and characteristics of active sources. In realistic environments, multiple sources may overlap. Source-specific segmentation and characterization are therefore particularly challenging. In this paper, we propose PI-SCAN (Permutation-Invariant Segmentation, Characterization, and Assignment Network), a joint set-based learning framework for source-specific segmentation and characterization of overlapping interference signals. A logarithmic power spectrogram derived from complex IQ samples is mapped to six unordered prediction slots. For each slot, the model estimates objectness, interference type, center frequency, bandwidth, received signal strength, binary offset carrier (BOC) modulation, and a source-specific segmentation mask. Permutation-invariant Hungarian assignment aligns the predicted slots with the unordered ground-truth sources, while a weighted multi-task objective jointly optimizes the individual prediction tasks. The framework is evaluated using a ray-traced industrial environment containing mixtures of one to six simultaneously active interferers drawn from 94 waveform configurations across six interference classes. The full seven-task configuration achieves a detection F1-score of 74.8%, type and BOC accuracies of 97.3% and 98.4%, and mean absolute errors of 1.29MHz, 2.54MHz, and 3.19dB for center frequency, bandwidth, and signal strength. Using only objectness, type, and mask prediction increases the F1-score to 91.1%, highlighting the trade-off between detection and comprehensive characterization.
