id: '2605.31440'
title: Synthetic Data Generation With Incomplete Survey Data Under Informative Sampling
authors:
  - Ayat Almomani
  - Won Chang
  - Youngdeok Hwang
  - Young Min Kim
  - Hang J. Kim
year: 2026
abstract: We propose a Bayesian framework for data synthesis and imputation in complex survey settings with informative sampling. To address variance underestimation in existing Bayesian approaches and to accommodate the missing data encountered in survey data, we introduce an adaptive weighting scheme for parameter estimation. We show that the proposed weighting yields consistent estimators with an asymptotically valid Godambe information matrix. The framework is flexible, accommodating a broad class of Bayesian models and facilitating practical implementation. Simulation studies demonstrate that the proposed method provides accurate uncertainty quantification for both model parameters and synthetic population inference.
