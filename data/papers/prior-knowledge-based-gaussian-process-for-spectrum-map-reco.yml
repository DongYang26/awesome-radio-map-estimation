id: prior-knowledge-based-gaussian-process-for-spectrum-map-reco
title: Prior Knowledge-Based Gaussian Process for Spectrum Map Reconstruction in LEO Satellite Systems
authors:
  - Fangyuan Liu
  - Jun Yuan
  - Yaping Wang
  - Yiqing Liu
  - Huaiqi Jia
  - Lei Zhang
year: 2026
venue: 2026 IEEE International Conference on Radio Frequency and Antenna Technologies (RFAT)
abstract: Accurate spectrum map reconstruction in low Earth orbit (LEO) satellite systems is challenging under extremely sparse received signal strength (RSS) measurements. Conventional interpolation, completion, and purely data-driven methods either ignore LEO-specific propagation physics or require dense labeled data, leading to degraded fidelity. This paper proposes a prior knowledge-based Gaussian process (PKGP) method that embeds free-space and atmospheric path loss, multi-beam antenna gain patterns, and Shadowed Rician/squared Shadowed Rician (SR/SSR) fading into the GP mean and covariance kernel. A geometry-aware feature mapping aligned with the beam layout is further introduced to model the log-domain residual field, while hyperparameters are learned by maximizing the marginal likelihood. Simulations in a dual-beam LEO scenario show that, at sampling ratios of 0.15%–1%, PKGP achieves lower RMSE and higher SSIM than Vanilla GP, Kriging, inverse distance weighting, and matrix completion.
