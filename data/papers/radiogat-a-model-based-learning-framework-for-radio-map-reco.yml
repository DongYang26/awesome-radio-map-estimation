id: radiogat-a-model-based-learning-framework-for-radio-map-reco
title: 'RadioGAT: A Model-Based Learning Framework for Radio Map Reconstruction via Graph Attention Networks'
authors:
  - Xiaojie Li
  - Hang Li
  - Xiaoyang Li
  - Guangxu Zhu
  - Nan Qi
  - Ming Xiao
year: 2025
venue: IEEE Wireless Communications and Networking Conference
abstract: Reconstructing accurate radio maps is crucial for optimizing wireless network performance and managing spectrum efficiently. In real-world scenarios, radio map data, often sparse and incompletely labelled, poses significant challenges to traditional learning techniques. Graph Neural Networks (GNNs) have become instrumental in efficiently reconstructing radio maps (RMR) in such environments by effectively encoding correlations in unstructured data. Existing GNN-based methods, however, are limited as they typically consider only single factors like location, environment, or transmitter characteristics during correlation encoding. To overcome this limitation, we introduce RadioGAT, a propagation model-based approach that comprehensively integrates these factors. We further utilize Graph Attention Networks to enable semi-supervised learning, enhancing the accuracy of radio map reconstruction. Our experimental results demonstrate the superiority and robustness of RadioGAT, particularly at low sampling rates, and highlight the importance of selecting appropriate correlation encoding methods based on the data availability for RMR.
