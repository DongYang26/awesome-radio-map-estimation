id: physics-informed-ai-driven-cross-frequency-channel-knowledge
title: Physics-Informed AI-driven Cross-Frequency Channel Knowledge Map Construction
authors:
  - Shen Fu
  - Xingyu Tang
  - Ziyu Huang
  - Yong Zeng
year: 2026
venue: ICC 2026 - IEEE International Conference on Communications
abstract: Channel knowledge map (CKM), by leveraging location-specific channel prior knowledge, is expected to bring a paradigm shift from the conventional environment-unaware to future environment-aware communication and sensing. Traditional cross-frequency channel prediction methods mainly focus on single-link end-to-end prediction between a user and a base station (BS). In contrast, cross-frequency CKM construction may exploit the multi-link user-BS channel relationships within a region, enabling the utilization of spatial and environmental dependencies for more accurate and robust reconstruction. To address the challenge of limited channel knowledge observations at certain frequency bands, this paper proposes a cross-frequency CKM construction framework that leverages the complete sub-6 GHz (Sub6G) CKM together with sparse upper-6 GHz (U6G) observations to reconstruct complete U6G CKM. The proposed method integrates supervised artificial intelligence (AI) with wireless-domain physical priors, ensuring both physical consistency and improved cross-frequency generalization. Experimental results verify that the proposed method significantly outperforms benchmark schemes.
