id: channel-knowledge-map-assisted-dual-domain-tracking-for-high
title: Channel Knowledge Map-assisted Dual-domain Tracking for High-mobility Wireless Networks
authors:
  - Ruolin Du
  - Zhiqiang Wei
  - Zai Yang
  - Yong Zeng
  - Derrick Wing Kwan Ng
year: 2025
venue: 2025 IEEE International Conference on Communications Workshops (ICC Workshops)
abstract: This paper presents a novel channel knowledge map (CKM)-assisted dual-domain tracking and predictive beamforming scheme for high-mobility wireless networks. In the coordinate domain, an extended Kalman filter (EKF) is employed accurately to predict and track the state (i.e., location and velocity) of a moving communication receiver across successive time slots under both line-of-sight (LoS)-present and LoS-absent conditions, where the CKM provides critical prior mapping from multipath channel parameters to potential target location. In the beam domain, the updated location of the receiver is fed back to the CKM, providing essential a priori information of angle of arrival (AoA) variations, which is subsequently integrated to establish beam transition models for refined beam tracking, depending on the angular variation situation of each path. Simulation results demonstrate the proposed scheme achieves significant improvements in both target and beam tracking performance compared to the state-of-art schemes, particularly in AoA tracking of non-line-of-sight (NLoS) paths, highlighting the potential gain of employing CKM in high-mobility communications.
