id: robust-pathloss-radio-map-prediction-via-physics-informed-tr
title: Robust Pathloss Radio Map Prediction via Physics-Informed Transformer
authors:
  - Zi-Hao Liang
  - Cong Shen
year: 2026
venue: International Symposium on Dynamic Spectrum Access Networks
abstract: Accurate pathloss (PL) prediction is fundamental to the planning and optimization of modern wireless systems. Encoder–decoder convolutional neural network (CNN) architectures have been widely adopted for data-driven radio map generation; however, their inherently local inductive bias can under-represent long-range, path-dependent effects governed by the transmitter–receiver (Tx–Rx) geometry, which may result in large outliers. In this work, we propose a physics-informed transformer model for data-driven outdoor PL prediction. The transformer casts PL prediction as sequence learning along the Tx–Rx terrain profile using structured tokens and a shared model for line-of-sight (LOS) and non-line-of-sight (NLOS) regimes. As a case study, we evaluate the irregular-terrain PL prediction performance using a large-scale dataset generated by the Terrain-Integrated Rough-Earth Model (TIREM). Evaluated under propagation parameter set identifier (PID) variation (fixed location) and location identifier (OID) variation (fixed parameters), the transformer solution consistently reduces the tail of the error distribution across most cases, improving robustness relative to a strong CNN-based UNet (CNN–UNet) baseline that predicts PL maps from terrain and parameter channels.
