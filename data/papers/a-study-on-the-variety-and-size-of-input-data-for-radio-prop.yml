id: a-study-on-the-variety-and-size-of-input-data-for-radio-prop
title: A study on the variety and size of input data for radio propagation prediction using a deep neural network
authors:
  - Takahiro Hayashi
  - Tatsuya Nagao
  - Satoshi Ito
year: 2020
venue: European Conference on Antennas and Propagation
abstract: Not only has the volume of mobile traffic been increasing exponentially in recent years, making various services available, such as IoT and connected cars moving at high speed, has also become necessity; moreover, the quality of these services has to be extremely high. As a result, it is necessary to clarify the complicated characteristic of radio propagation. In this paper, we describe radio propagation prediction using a deep neural network (DNN) that can regress to non-linear functions without having to derive complex functions. DNN can learn the features needed for problem solving from input data, in other words, in radio propagation prediction, it is able to learn the environment parameters required for propagation prediction from spatial information that is input such as map data. Based on the evaluation results of propagation prediction with DNN using measurement data in an urban area, we clarify the relationship between the variety and size of input data from the viewpoint of estimation accuracy and computational complexity.
