id: '2605.31368'
title: Generic simplicity for self-adjoint operators under bounded potential perturbations
authors:
  - Marianna Chatzakou
  - Bernard Helffer
year: 2026
abstract: We are interested in the generic simplicity of the spectrum of self-adjoint operators under bounded potential perturbations. More precisely, given a semibounded self-adjoint operator with compact resolvent and a suitable space of real-valued bounded perturbations, we study whether all eigenvalues of the perturbed operator are simple for a generic choice of the potential. In the first part of this paper we prove an abstract criterion which ensures that the set of perturbations giving only simple eigenvalues is residual. In the second part, we apply this criterion to several geometric and analytic settings, including sub-Laplacians and maximally hypoelliptic operators on compact manifolds, Laplacians on bounded domains with different boundary conditions, and Schrödinger-type operators on non-compact spaces.
