id: an-hourly-streamflow-forecasting-model-coupled-with-an-enfor
title: An Hourly Streamflow Forecasting Model Coupled with an Enforced Learning Strategy
authors:
  - Ming-Chang Wu
  - Gwo-Fong Lin
year: 2015
abstract: Floods, one of the most significant natural hazards, often result in loss of life and property. Accurate hourly streamflow forecasting is always a key issue in hydrology for flood hazard mitigation. To improve the performance of hourly streamflow forecasting, a methodology concerning the development of neural network (NN) based models with an enforced learning strategy is proposed in this paper. Firstly, four different NNs, namely back propagation network (BPN), radial basis function network (RBFN), self-organizing map (SOM), and support vector machine (SVM), are used to construct streamflow forecasting models. Through the cross-validation test, NN-based models with superior performance in streamflow forecasting are detected. Then, an enforced learning strategy is developed to further improve the performance of the superior NN-based models, i.e., SOM and SVM in this study. Finally, the proposed flow forecasting model is obtained. Actual applications are conducted to demonstrate the potential of the proposed model. Moreover, comparison between the NN-based models with and without the enforced learning strategy is performed to evaluate the effect of the enforced learning strategy on model performance. The results indicate that the NN-based models with the enforced learning strategy indeed improve the accuracy of hourly streamflow forecasting. Hence, the presented methodology is expected to be helpful for developing improved NN-based streamflow forecasting models.
