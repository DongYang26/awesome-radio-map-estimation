id: a-graph-neural-network-based-radio-map-construction-method-f
title: A Graph Neural Network Based Radio Map Construction Method for Urban Environment
authors:
  - Guokai Chen
  - Yongxiang Liu
  - T. Zhang
  - Jianzhao Zhang
  - Xiye Guo
  - Jun Yang
year: 2023
venue: IEEE Communications Letters
abstract: Radio maps can enhance the capability of wireless sensor networks and improve the efficiency of spectrum utilization. However, the construction of an accurate radio map in the urban environment is a challenging task, since the dense buildings lead to a non-line-of-sight (NLOS) transmission environment. With this focus, we first transform the spatial sparse measurement points into a graph structure and extract the connected relation through the building map. Then, we propose a graph neural network (GNN) scheme to recover the complete radio map from sparse measurements. Numerical results show that our algorithm outperforms the benchmark methods in accuracy and is robust to noise.
