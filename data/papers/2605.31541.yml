id: '2605.31541'
title: Remarks on Linear Growth of Vorticity Gradients and Support Diameters for 2D Euler Flow in Half-Plane
authors:
  - Shaoqing Chen
  - Yongzhong Sun
year: 2026
abstract: It has been conjectured that generic smooth solutions of the two-dimensional Euler equation exhibit linear growth of vorticity gradients. We prove an elementary arbitrary-background perturbation principle in the odd symmetric setting. More precisely, for any compactly supported nonnegative function in the half-plane, one can find an arbitrarily small smooth nonnegative perturbation whose associated solution undergoes linear-in-time filamentation in the quadrant. The main ingredients are the lower bound of the center of mass given by Iftimie-Sideris-Gamblin, and the velocity estimate for the sparse part to capture those slowly moving particles.
