id: '2609.40280'
title: Uncertainty-Guided UAV Spectrum Cartography with Deep-Unfolded Online Tensor Decomposition
authors:
  - Shang-Jie Zhuang
  - Jia-Hui Liang
  - Shi-Jian Gao
year: 2026
abstract: Spectrum cartography is crucial for spectrum-aware resource management in low-altitude networks, where uncrewed aerial vehicles (UAVs) collect spectrum measurements to reconstruct power spectral density (PSD) maps. However, limited energy and sensing bandwidth make measurements sparse in space and incomplete in frequency. To collect these measurements efficiently, the UAV actively plans its next move based on the latest map and its uncertainty, which requires rapid online reconstruction. We therefore propose an active online spectrum cartography framework. We first develop online deep-unfolded tensor decomposition (ODU-TD) for rapid map updates. An ensemble of reconstructors then estimates uncertainty to select informative sensing targets, and a learning-based policy determines the UAV movement and sensing bandwidth under the energy budget. Experiments show that ODU-TD achieves an approximately 27-fold speedup over online tensor decomposition and the lowest normalized mean square error (NMSE) among the compared reconstructors under sparse spatial and spectral observations, and the proposed framework reduces the NMSE by at least 55% compared with the representative baselines.
