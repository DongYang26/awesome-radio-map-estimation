id: clustered-channel-estimation-and-prediction-with-channel-kno
title: Clustered Channel Estimation and Prediction with Channel Knowledge Map
authors:
  - Guanya Meng
  - Xiujun Zhang
  - Xiaofeng Zhong
  - Shidong Zhou
year: 2025
venue: 2025 IEEE 102nd Vehicular Technology Conference (VTC2025-Fall)
abstract: In multiple-input multiple-output (MIMO) wireless communication systems, accurate and low-overhead channel state information (CSI) acquisition is crucial for achieving high performance, which is significantly hampered by user mobility. To address the challenge of efficient CSI acquisition in high-mobility scenarios, this paper proposes a clustered channel estimation and prediction method with historical channel knowledge, where a channel knowledge map (CKM) is constructed using historical channel estimates from other users. During the channel estimation phase, the clustered channel is projected onto a low-rank subspace learned from historical estimates, thereby exploiting the sparsity of the multipath channel without extra overhead. In the channel prediction phase, the CKM provides channel temporal correlation characteristics at the required time granularity, which is not limited by the current user’s pilot interval, enables accurate prediction of future channels. Simulation results demonstrate that the proposed method not only significantly improves accuracy of channel estimation and prediction but also maintains channel prediction performance with low pilot overhead.
