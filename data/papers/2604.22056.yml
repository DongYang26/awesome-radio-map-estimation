id: '2604.22056'
title: 'Learning coverage- and power-optimal transmitter placement from city maps: A comparative study of direct and indirect neural approaches'
authors:
  - Çağkan Yapar
year: 2026
venue: Computer Communications
abstract: 'Optimal wireless transmitter placement is a central task in radio-network planning, and exhaustive search becomes prohibitively expensive at scale. This paper studies the single-transmitter setting under a learned propagation model, enabling exhaustive per-pixel assessment at scale in a regime where measurement-based labeling is infeasible and ray-tracing-based labeling is computationally out of reach. We introduce a dataset of 167525 urban scenarios (RadioMapSeer-Deployment) with dual ground-truth labels for coverage-optimal and power-optimal transmitter locations. Benchmark analysis reveals an asymmetric coverage-power trade-off: coverage-optimal placement sacrifices 13.86% of received-power, whereas power-optimal placement sacrifices 5.50% of coverage; the best balanced placement lies at $\bar{d}=2.60$ from the ideal point (100%,100%). We evaluate two learning formulations: indirect heatmap-based models predicting received-power radio maps, and direct score-map models predicting the objective landscape over feasible transmitter locations. Within the heatmap family, discriminative models deliver one-shot predictions 1350-2400$\times$ faster than exhaustive search, while diffusion models additionally support multi-sample inference that improves single-objective performance and, by reusing the same sample pool under a balanced criterion, recovers strong balanced placements without explicit multi-objective training. Dual score-map strategies combining power and coverage score-maps match the exhaustive balanced optimum ($\bar{d}=2.60$) and remain close to it across smaller candidate budgets, at 14-22$\times$ speedups including the cost of evaluating shortlisted candidates. Dual score-map methods are strongest overall, whereas heatmap formulations remain attractive for their physically meaningful intermediate maps and, in the diffusion setting, for inference-time search.'
