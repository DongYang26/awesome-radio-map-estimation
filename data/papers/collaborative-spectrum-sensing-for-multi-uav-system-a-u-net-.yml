id: collaborative-spectrum-sensing-for-multi-uav-system-a-u-net-
title: 'Collaborative Spectrum Sensing for Multi-UAV System: A U-Net Approach With Uncertainty Awareness'
authors:
  - Jie Shi
  - Jiaxin Wu
  - Jingzheng Chong
  - Zhihua Yang
year: 2025
venue: IEEE Transactions on Vehicular Technology
abstract: The spectrum sensing in urban area confronts with intricate terrains and irregular buildings, leading to complex characteristic of electronic magnetic wave propagation, which presents huge challenges such as low accuracy and efficiency for existing spectrum-sensing approaches integrated with Unmanned Aerial Vehicles (UAVs). To address this challenge, we propose a Uncertainty-Aware U-Net based Collaborative Spectrum Sensing (UAUCSS) scheme for multi-UAV systems, which has spectrum-sensing capability with high accuracy and efficiency in complex urban environments through UAVs collaboration. In particular, a Voronoi Partitioning based Path Planning (VP3) algorithm is developed to achieve efficient data collection, which could dynamically plan each UAV' trajectory in the pre-allocated task region with a well-designed uncertainty map. Experiments on a real-data set show that the proposed UAVCSS can perform better with respects to the sensing accuracy and efficiency compared with typical sensing algorithms KernelRidgeRegrEstimator and KNNEstimator.
