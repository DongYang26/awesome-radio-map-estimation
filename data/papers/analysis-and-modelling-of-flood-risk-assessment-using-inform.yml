id: analysis-and-modelling-of-flood-risk-assessment-using-inform
title: Analysis and modelling of flood risk assessment using information diffusion and artificial neural network
authors:
  - Qiong Li
  - Xingwen Jiang
  - Donghan Liu
year: 2013
abstract: 'Floods are a serious hazard to life and property. The traditional probability statistical method is acceptable in analysing the flood risk but requires a large sample size of hydrological data. This paper puts forward a composite method based on artificial neural network (ANN) and information diffusion method (IDM) for flood analysis. Information diffusion theory helps to extract as much useful information as possible from the sample and thus improves the accuracy of system recognition. Meanwhile, an artificial neural network model, back-propagation (BP) neural network, is used to map the multi-dimensional space of a disaster situation to a one-dimensional disaster space and to enable resolution of the grade of flood disaster loss. These techniques all contribute to a reasonable prediction of natural disaster risk. As an example, application of the method is verified in a flood risk analysis in China, and the risks of different flood grades are determined. Our model yielded very good results and suggests that the methodology is effective and practical, with the potentiality to be used to forecast flood risk for use in flood risk management. It is also hoped that by conducting such analyses lessons can be learned so that the impact of natural disasters such as floods can be mitigated in the future. Keywords: artificial neural network, information diffusion, flood, risk analysis, assessment'
