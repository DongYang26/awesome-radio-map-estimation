year: 2026
venue: IEEE Antennas and Wireless Propagation Letters
abstract: Path loss (PL) map prediction is an important task for wireless propagation modeling and network planning. Neural network (NN)-based approaches have been widely studied due to their higher efficiency than ray tracing (RT). However, most existing methods focus on 2-D PL maps. To address the 3-D PL map prediction problem, this letter proposes a multialtitude PL map prediction framework based on an NN architecture. The proposed model adopts a dual-encoder design to extract heterogeneous features from the environment and the transmitter location and uses a height-aware feature fusion module to embed altitude conditioning into the fused features, enabling the network to differentiate PL patterns across altitude planes. Experimental results show that the proposed model improves prediction accuracy over representative baselines and substantially reduces inference time compared with RT.
