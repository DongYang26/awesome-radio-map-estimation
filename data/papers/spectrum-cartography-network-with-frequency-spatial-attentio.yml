id: spectrum-cartography-network-with-frequency-spatial-attentio
title: Spectrum Cartography Network with Frequency-Spatial Attention Module
authors:
  - Yuhao Bian
  - Jinghong Sun
  - Wenbin Guo
year: 2025
venue: 2025 5th International Conference on Intelligent Communications and Computing (ICICC)
abstract: Radio maps quantify the electromagnetic environment across time, space, and frequency. However, sparse measurements due to limited sensor deployment and inaccessible regions make accurate reconstruction challenging. Traditional methods rely on local smoothness, while recent deep learning approaches still struggle with broadband cross-frequency correlations and multi-dimensional data. We propose FSAM-SCNet, a novel architecture integrating channel and spatial attention to adaptively focus on key frequency bands and spatial regions. FSAM-SCNet explicitly models 3D spatial-spectral radio data, achieving superior reconstruction accuracy and robustness compared to methods, especially under sparse and noisy conditions.
