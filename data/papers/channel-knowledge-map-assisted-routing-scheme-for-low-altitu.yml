  - Yitao Xu
  - Jiangchun Gu
  - Haichao Wang
  - Jiabao Wang
  - Xingyu Zhou
year: 2026
venue: IEEE Transactions on Vehicular Technology
abstract: To ensure the robust development of the low-altitude economy (LAE), reliable communication within the network is essential. This paper proposes a channel knowledge map (CKM)-assisted routing scheme to address the challenges of complex environments and high mobility in LAE scenarios. Traditional statistical channel models fail to quantify complex propagation environments, while real-time channel estimation in high mobility scenarios incurs high control overhead and outdated channel information. CKM establishes a mapping from the location to the channel knowledge, enabling the estimate of channel gain without real-time interaction, thereby reducing overhead and enhancing adaptability to node mobility. This approach is particularly suitable for the channel information acquisition in LAE scenarios. In this paper, we first propose a general channel gain acquisition approach for routing design, leveraging the CKM to reduce the demands for information interaction. Subsequently, the specific routing protocols for both global routing and greedy routing, called CKM-DAR, CKM-EAR, and CKM-GR, are proposed. Additionally, recovery forwarding and neighbor overhead mechanisms are introduced to improve routing accuracy and reliability despite position errors. Simulation results validate the effectiveness of the CKM-assisted routing schemes in achieving lower transmission delays and higher energy efficiency, with affordable control overhead, in the complex environment and high mobility scenarios.
