id: secure-communication-and-eavesdropper-localization-via-chann
title: Secure Communication and Eavesdropper Localization via Channel Knowledge Map
authors:
  - Di Wu
  - Yong Zeng
year: 2025
venue: 2025 IEEE 101st Vehicular Technology Conference (VTC2025-Spring)
abstract: This paper proposes an advanced framework utilizing channel knowledge map (CKM) to strengthen secure communication and facilitate eavesdropper localization. CKM is established to learn the spatially unique channel characteristics, enabling it to distinguish between legitimate user equipment (UE) and eavesdropper channels without requiring prior knowledge of the latter. This new capability addresses fundamental challenges in conventional physical-layer security methods that rely heavily on prior information of channel state information (CSI). By leveraging CKM, the framework enables multiple critical functionalities, including eavesdropper detection and localization, as well as beamforming design for secure communication. Simulation results validate the advantages of the proposed CKM-enabled approach over several benchmarks, such as statistical model-based method, particularly in terms of signal-to-leakage-and-noise ratio (SLNR) and localization performance.
