id: ai-driven-inverse-antenna-design-in-uwb-band-embedding-forwa
title: 'AI-Driven Inverse Antenna Design in UWB Band: Embedding Forward Consistency Into Deep Learning Architectures'
authors:
  - Olaoluwa Adegboye
  - Taoreed Akinola
  - Xiangfang Li
  - Lijun Qian
year: 2026
venue: IEEE Transactions on Antennas and Propagation
abstract: 'This work presents a deep learning-based inverse design framework for rapid prototyping of fork antennas operating within the ultrawideband (UWB) frequency. By integrating a pretrained frozen forward model into the inverse training process, the proposed method with forward-consistency loss ensures that predicted antenna geometries yield physically valid performance metrics. Three models were trained: deep neural network (DNN), long short-term memory (LSTM), and echo state network (ESN), to map performance targets to antenna dimensions. The results show that the models trained with forward-consistency loss achieve a lower error in return loss, bandwidth, and frequency metrics. The proposed framework considering both forward loss and reverse loss outperforms inverse-only models, especially in complex high-frequency wideband scenarios. DNN and LSTM models demonstrated the best generalization at 3.5 and 8 GHz, while all models significantly reduced the computational cost of antenna design compared to conventional simulation sweeps.'
