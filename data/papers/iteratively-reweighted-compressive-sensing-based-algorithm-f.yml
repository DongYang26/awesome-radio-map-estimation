id: iteratively-reweighted-compressive-sensing-based-algorithm-f
title: Iteratively reweighted compressive sensing based algorithm for spectrum cartography in cognitive radio networks
authors:
  - B. Jayawickrama
  - E. Dutkiewicz
  - I. Oppermann
  - M. Mueck
year: 2014
venue: IEEE Wireless Communications and Networking Conference
abstract: Spectrum cartography is the process of constructing a map showing Radio Frequency signal strength over a finite geographical area. In our previous work we formulated spectrum cartography as a compressive sensing problem and we illustrated how cartography can be used in the context of discovering spectrum holes in space that can be exploited locally in cognitive radio networks. This paper investigates the performance of compressive sensing based approach to cartography in a fading environment where realtime channel estimation is not feasible. To accommodate for lack of channel information we take an iterative approach. We extend the well-known iteratively reweighted ℓ1 minimisation approach by exploiting spatial correlation between two points in space. We evaluate the performance in an urban environment where Rayleigh fading is prominent. Our numerical results show a significant improvement in the probability of accurately making a spectrum sensing decision, in comparison to the well-known weighted approach and the traditional compressive sensing based method.
