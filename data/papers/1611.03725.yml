id: '1611.03725'
title: Practical Interpolation for Spectrum Cartography through Local Path Loss Modeling
authors:
  - S. Sagari
  - L. Greenstein
  - W. Trappe
year: 2016
venue: arXiv.org
abstract: A fundamental building block for supporting better utilization of radio spectrum involves predicting the impact that an emitter will have at different geographic locations. To this end, fixed sensors can be deployed to spatially sample the RF environment over an area of interest, with interpolation methods used to infer received power at locations between sensors. This paper describes a radio map interpolation method that exploits the known properties of most path loss models, with the aim of minimizing the RMS errors in predicted dB-power. We show that the results come very close to those for ideal Simple Kriging. Moreover, the method is simpler in terms of real-time computation by the network and it requires no knowledge of the spatial correlation of shadow fading. Our analysis of the method is general, but we exemplify it for a specific network geometry, comprising a grid-like pattern of sensors. We also provide comparisons to other widely used interpolation methods.
