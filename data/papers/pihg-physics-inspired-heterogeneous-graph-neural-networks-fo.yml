year: 2026
venue: IEEE Transactions on Wireless Communications
abstract: Radio maps are instrumental in optimizing wireless network performance by providing spatial distributions of signal power. However, predicting multi-band radio maps across diverse environments remains challenging, as propagation behaviors vary significantly with frequency and environmental complexity. Although some existing approaches address this issue by incorporating physical constraints into their loss functions, they operate at a coarse level and struggle to capture fine-grained, non-Euclidean propagation dependencies. To address these limitations, we propose PIHG, a physics-inspired heterogeneous graph neural network for multi-band radio map prediction. PIHG incorporates physical knowledge into the learning process for coarse-grained radio map estimation and further refines the prediction using a propagation-aware heterogeneous graph that models environment-dependent spatial dependencies among transmitters, receivers, and obstacles. Extensive experiments on a large-scale multi-band radio map dataset demonstrate that PIHG consistently outperforms state-of-the-art methods in both accuracy and generalization across different frequency bands and environments. The code for PIHG is available at https://github.com/Shirleyue/PIHG
