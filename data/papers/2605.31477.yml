id: '2605.31477'
title: Nonnegative Ricci Curvature and Uniformly Convex Boundary Forces Compactness
authors:
  - Zetian Yan
  - Xingyu Zhu
year: 2026
abstract: We confirm a compactness conjecture of M. Li. If a complete Riemannian manifold has nonnegative Ricci curvature and uniformly convex boundary in the sense that the second fundamental form satisfies $h\ge1$. Then we prove it is compact, and consequently has finite fundamental group. The proof uses monotone quantities constructed via positive proper harmonic functions with Neumann condition.
