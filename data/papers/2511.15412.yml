id: '2511.15412'
title: Spatially Consistent Air-to-Ground Channel Modeling and Simulation via 3D Shadow Projections
authors:
  - Evgenii Vinogradov
  - Aymen Fakhreddine
  - Abdul Saboor
  - S. Abadal
  - Sofie Pollin
year: 2025
venue: International Conference on Computing, Networking and Communications
abstract: We present an approach for spatially-consistent semi-deterministic Air-to-Ground (A2G) channel modeling in Unmanned Aerial Vehicle-assisted networks. We use efficient 3D building shadow projections to determine Line-of-Sight (LOS) regions, enabling fast generation of LOS maps. By integrating LOS-aware deterministic path loss with stochastic shadow fading, the approach produces spatially consistent A2G radio maps suitable for environment- and mobility-aware channel evaluation and performance prediction. Simulation results in ITU-compliant Manhattan grid environments demonstrate the model’s ability to reflect key urban propagation characteristics, such as LOS blockage patterns and outage behavior. The proposed approach provides an efficient alternative to ray tracing or fully stochastic models, with particular relevance for user mobility, link planning, and radio map generation in 6 G non-terrestrial networks.
