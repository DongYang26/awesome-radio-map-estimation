id: radio-map-construction-under-sparse-sampling-conditions-an-a
title: 'Radio Map Construction Under Sparse Sampling Conditions: An Attention-Driven Deep Neural Network Method Guided by Target Space Priors'
authors:
  - Tianrong Deng
  - Zhou Zou
year: 2026
venue: 2026 6th International Conference on Intelligent Communications and Computing (ICICC)
abstract: Radio map construction provides an effective solution to the scarcity of spectrum resources. To address the challenges of high-precision radio map construction under sparse sampling, this paper proposes a hybrid data-model-driven framework based on a Transformer framework. In this approach, Gaussian Process Regression (GPR) is employed to model the spatial signal propagation as a prior, generating predictive distributions of the continuous signal field. Subsequently, these predictive distributions are transformed into spatial attention weight maps, which are explicitly embedded into a Transformer-guided network to facilitate the precise extraction of spectral features. Finally, global radio map construction is achieved through non-linear feature mapping and signal reconstruction. Experimental results demonstrate that the proposed method exhibits superior reconstruction accuracy and robustness across varying sparse sampling rates and signal-to-noise ratios (SNRs).
