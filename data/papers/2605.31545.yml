id: '2605.31545'
title: Preference-Aware Rubric Learning for Personalized Evaluation
authors:
  - Yilun Qiu
  - Xiaoyan Zhao
  - Yang Zhang
  - Yuxin Chen
  - Cilin Yan
  - Jiayin Cai
