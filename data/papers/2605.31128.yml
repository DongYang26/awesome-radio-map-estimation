id: '2605.31128'
title: The classification of integral endotrivial complexes
authors:
  - Juan Omar Gómez
  - Sam K. Miller
year: 2026
abstract: We describe the group of endotrivial complexes, i.e., the Picard group, of the derived category of permutation modules for a finite group over a commutative Noetherian ring. As a result, we deduce that not every endotrivial with integer coefficients arises from a homotopy representation, i.e., an invertible genuine equivariant spectrum. Along the way, we establish a descent result with respect to subgroups of prime-power order, show that oriented endotrivial complexes are line bundles, that is, locally trivial with respect to an open cover of the Balmer spectrum, and provide a topological construction of forerunner homomorphisms, answering a question of the second-named author.
